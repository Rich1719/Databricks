
resources:
  jobs:
    retail_pipeline:
      name: Retail_Org_${bundle.target}

      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ../notebooks/bronze/Retail_Org_Bronze.ipynb
            source: GIT

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../notebooks/silver/Retail_Org_Silver.ipynb
            source: GIT

        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../notebooks/gold/Retail_Org_Gold.ipynb
            source: GIT
            base_parameters:
              retail_env: ${bundle.target}
