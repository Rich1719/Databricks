
resources:
  jobs:
    retail_pipeline:
      name: Retail_Org_${bundle.target}

      git_source:
        git_url: https://github.com/Rich1719/Databricks.git
        git_provider: gitHub
        git_branch: main

      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: /retail-databricks/notebooks/bronze/Retail_Org_Bronze
            source: GIT

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: /retail-databricks/notebooks/silver/Retail_Org_Silver
            source: GIT

        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: /retail-databricks/notebooks/gold/Retail_Org_Gold
            source: GIT
            base_parameters:
              retail_env: ${bundle.target}
