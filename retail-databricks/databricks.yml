
bundle:
  name: retail-databricks

include:
  - resources/*.yml

sync:
  include:
    - notebooks/**
    - src/**
    - data/**

variables:
  schedule_cron:
    description: "Daily pipeline execution time"

  environment:
    description: "Deployment environment"

targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      environment: dev
      schedule_cron: "0 0 9 * * ?"

  test:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      environment: test
      schedule_cron: "0 0 9 * * ?"

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      environment: prod
      schedule_cron: "0 0 9 * * ?"
