
bundle:
  name: retail-databricks

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

include:
  - resources/*.yml

sync:
  include:
    - notebooks/**
    - src/**

targets:
  dev:
    mode: development
    default: true
    variables:
      schedule_cron: "0 30 8 * * ?"

  test:
    mode: production
    variables:
      schedule_cron: "0 30 8 * * ?"

  prod:
    mode: production
    variables:
      schedule_cron: "0 30 8 * * ?"
